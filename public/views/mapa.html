  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

  <style type="text/tailwindcss">
    @theme {
        --color-zinc950: #0c0c0e;
        --color-surface: #161618;
        --color-secondary: #1f2024;
        --color-lime: #bef264;
        --color-lime-hover: #d9f99d;
        --color-fg: #f3f3f3;
        --color-muted: #9ca39e;
        --font-display: "Archivo Black", sans-serif;
        --font-body: "Barlow", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      .glow-lime    { box-shadow: 0 0 24px #bef264; }
      .glow-lime-sm { box-shadow: 0 0 12px rgba(190,242,100,0.6); }

      @keyframes pulse-lime {
        0%, 100% { box-shadow: 0 0 0 0    rgba(190,242,100,0.7); }
        50%       { box-shadow: 0 0 0 10px rgba(190,242,100,0);   }
      }
      .live-pin { animation: pulse-lime 2s infinite; }

      /* ── Pin styles (mesmo do index.html) ─────────────────────── */
      .sports-map-marker { background: transparent; border: 0; }
      .sports-map-pin {
        --pin-color: #a3e635;
        --pin-glow: rgba(163,230,53,0.52);
        --pin-ring: rgba(163,230,53,0.32);
        position: relative; width: 44px; height: 56px; display: block;
        transform-origin: 50% 100%;
        transition: transform 180ms ease, filter 180ms ease;
        filter: drop-shadow(0 10px 10px rgba(0,0,0,0.55));
      }
      .sports-map-pin__drop {
        position: absolute; left: 5px; top: 0;
        width: 34px; height: 34px;
        border-radius: 50% 50% 50% 0;
        background: radial-gradient(circle at 28% 22%, rgba(255,255,255,0.5), transparent 27%), var(--pin-color);
        border: 2px solid transparent;
        box-shadow: inset 0 -9px 14px rgba(0,0,0,0.28);
        transform: rotate(-45deg);
        transition: border-color 180ms ease, box-shadow 180ms ease;
      }
      .sports-map-pin__icon {
        position: absolute; left: 10px; top: 5px; z-index: 1;
        width: 24px; height: 24px; border-radius: 999px;
        background: #111315; border: 0;
        display: flex; align-items: center; justify-content: center;
      }
      .sports-map-pin__icon img {
        width: 16px; height: 16px; object-fit: contain;
        filter: brightness(0) invert(1); opacity: 0.96;
      }
      .sports-map-pin--available  { --pin-color:#a3e635; --pin-glow:rgba(163,230,53,0.62); --pin-ring:rgba(163,230,53,0.34); }
      .sports-map-pin--reserve    { --pin-color:#facc15; --pin-glow:rgba(250,204,21,0.58);  --pin-ring:rgba(250,204,21,0.32); }
      .sports-map-pin--unavailable{ --pin-color:#8b8f98; --pin-glow:rgba(139,143,152,0.42); --pin-ring:rgba(139,143,152,0.26); opacity:.88; }
      .sports-map-pin:hover { transform: translateY(-5px) scale(1.08); filter: drop-shadow(0 16px 16px rgba(0,0,0,0.62)); }
      .sports-map-pin:hover .sports-map-pin__drop {
        border-color: var(--pin-ring);
        box-shadow: 0 0 0 4px var(--pin-ring), 0 0 20px var(--pin-glow), inset 0 -9px 14px rgba(0,0,0,0.28);
      }
      .sports-map-pin.is-selected { transform: translateY(-7px) scale(1.14); z-index: 2; }
      .sports-map-pin.is-selected .sports-map-pin__drop { border-color: #ffffff; box-shadow: inset 0 -9px 14px rgba(0,0,0,0.28); }
      .sports-map-pin.is-selected:hover { transform: translateY(-8px) scale(1.18); }
      .sports-map-pin.is-selected:hover .sports-map-pin__drop {
        box-shadow: 0 0 0 4px var(--pin-ring), 0 0 20px var(--pin-glow), inset 0 -9px 14px rgba(0,0,0,0.28);
      }

      /* ── Sidebar ──────────────────────────────────────────────── */
      #sidebar {
        transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      }
      #sidebar.sidebar-hidden {
        transform: translateX(-100%);
      }

      /* ── Place card hover ─────────────────────────────────────── */
      .place-card {
        transition: border-color 0.15s, background 0.15s;
        cursor: pointer;
      }
      .place-card:hover { border-color: rgba(190,242,100,0.35); }
      .place-card.is-active {
        border-color: rgba(190,242,100,0.6);
        background: rgba(190,242,100,0.04);
      }

      /* ── Filter chip ──────────────────────────────────────────── */
      .filter-chip {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 0.3rem 0.75rem; border-radius: 999px; white-space: nowrap;
        font-size: 0.72rem; font-family: "JetBrains Mono", monospace;
        border: 1px solid rgba(255,255,255,0.15); color: #9ca39e;
        transition: all 0.15s; cursor: pointer; user-select: none;
      }
      .filter-chip:hover { border-color: rgba(190,242,100,0.4); color: #d9f99d; }
      .filter-chip.active {
        border-color: #bef264; color: #bef264;
        background: rgba(190,242,100,0.08);
      }

      /* ── Scrollbar personalizada ──────────────────────────────── */
      #placeList::-webkit-scrollbar { width: 4px; }
      #placeList::-webkit-scrollbar-track { background: transparent; }
      #placeList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    </style>

        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-lime live-pin flex-shrink-0"></span>
          <p class="font-mono text-[10px] text-muted uppercase tracking-widest">Volta Redonda, RJ</p>
        </div>
      </div>

      <!-- Filtros por esporte -->
      <div class="px-4 py-3 border-b border-white/10 flex-shrink-0">
        <p class="font-mono text-[10px] text-muted uppercase tracking-widest mb-2">Filtrar por esporte</p>
        <div class="flex flex-wrap gap-1.5" id="filterBar">
          <button class="filter-chip active" data-filter="all">🗺️ Todos</button>
          <button class="filter-chip" data-filter="futebol">⚽ Futebol</button>
          <button class="filter-chip" data-filter="volei">🏐 Vôlei</button>
          <button class="filter-chip" data-filter="basquete">🏀 Basquete</button>
          <button class="filter-chip" data-filter="tenis">🎾 Tênis & Padel</button>
          <button class="filter-chip" data-filter="corrida">🏃 Corrida</button>
          <button class="filter-chip" data-filter="natacao">🏊 Natação</button>
          <button class="filter-chip" data-filter="ciclismo">🚴 Ciclismo</button>
        </div>

          Adicionar quadra
        </button>
        <p id="placeSelectionHint" class="hidden mt-2 text-xs text-lime" role="status"></p>
      </div>

        <p class="font-mono text-[10px] text-muted"><span id="resultCount">13</span> locais encontrados</p>

    <!-- ── MAPA ──────────────────────────────────────────────────────────────── -->

          </span>
        </div>
      </div>
    </div>

    <div id="addPlaceModal" class="hidden fixed inset-0 z-[1000] items-center justify-center bg-black/70 p-4"
      role="dialog" aria-modal="true" aria-labelledby="addPlaceTitle">
      <form id="addPlaceForm"
        class="w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl border border-white/10 bg-surface p-6 shadow-2xl">
        <h2 id="addPlaceTitle" class="font-display text-xl text-fg">Adicionar quadra</h2>
        <p id="addPlaceDescription" class="mt-1 text-sm text-muted">A localização foi marcada no mapa. Complete os dados
          do local.</p>
        <p id="selectedCoordinates" class="mt-2 font-mono text-xs text-lime"></p>
        <input id="placeLatitude" name="latitude" type="hidden" required />
        <input id="placeLongitude" name="longitude" type="hidden" required />
        <button id="choosePlaceLocation" type="button"
          class="hidden mt-2 text-sm text-lime underline underline-offset-2">Escolher outro ponto no mapa</button>

        <div class="mt-5 grid gap-4 sm:grid-cols-2">
          <label class="text-sm text-muted sm:col-span-2">
            Nome da quadra
            <input name="title" maxlength="120" required
              class="mt-1 w-full rounded-lg border border-white/10 bg-zinc950 px-3 py-2 text-fg" />
          </label>
          <label class="text-sm text-muted">
            Esporte
            <select name="sport" required
              class="mt-1 w-full rounded-lg border border-white/10 bg-zinc950 px-3 py-2 text-fg">
              <option value="society">Futebol society</option>
              <option value="futebol">Futebol</option>
              <option value="volei">Vôlei</option>
              <option value="basquete">Basquete</option>
              <option value="tenis">Tênis</option>
              <option value="raquete">Padel</option>
              <option value="corrida">Corrida</option>
              <option value="natacao">Natação</option>
              <option value="ciclismo">Ciclismo</option>
            </select>
          </label>
          <label class="text-sm text-muted">
            Tipo de local
            <input name="type" maxlength="80" required placeholder="Ex.: Quadra coberta"
              class="mt-1 w-full rounded-lg border border-white/10 bg-zinc950 px-3 py-2 text-fg" />
          </label>
          <label class="text-sm text-muted">
            Status
            <select name="status" required
              class="mt-1 w-full rounded-lg border border-white/10 bg-zinc950 px-3 py-2 text-fg">
              <option value="available">Disponível</option>
              <option value="reserve">Reserva</option>
              <option value="unavailable">Completo</option>
            </select>
          </label>
          <label class="text-sm text-muted">
            Endereço ou bairro
            <input name="address" maxlength="240" required
              class="mt-1 w-full rounded-lg border border-white/10 bg-zinc950 px-3 py-2 text-fg" />
          </label>
        </div>

        <p id="addPlaceError" class="hidden mt-4 text-sm text-red-400" role="alert"></p>
        <div class="mt-6 flex justify-end gap-3">
          <button id="cancelAddPlace" type="button"
            class="rounded-lg border border-white/15 px-4 py-2 text-sm text-fg hover:bg-secondary">Cancelar</button>
          <button id="submitAddPlace" type="submit"
            class="rounded-lg bg-lime px-4 py-2 text-sm font-semibold text-zinc-900 hover:glow-lime-sm">Salvar
            quadra</button>
        </div>
      </form>
    </div>
  </main>

      basquete: '../media/pins/pin-basquete.svg',
      tenis: '../media/pins/pin-tenis.svg',
      raquete: '../media/pins/pin-raquete.svg',
      corrida: '../media/pins/pin-corrida.svg',
      natacao: '../media/pins/pin-natacao.svg',
      ciclismo: '../media/pins/pin-bicicleta.svg',
    };

    // ── Mapa Leaflet ────────────────────────────────────────────────────────────
    const map = L.map('mapa-principal', {
      zoomControl: false,
      attributionControl: false,
    }).setView([-22.512, -44.087], 13);

    L.control.attribution({ position: 'topright' }).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    function escAttr(v) {
      return String(v).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[c]);
    }

    function makePinIcon(place) {
      const title = `${place.title} — ${STATUS_LABELS[place.status]}`;
      return L.divIcon({
        html: `
            <div class="sports-map-pin sports-map-pin--${place.status}" title="${escAttr(title)}" aria-label="${escAttr(title)}">
              <span class="sports-map-pin__drop"></span>
              <span class="sports-map-pin__icon">
                <img src="${place.icon}" alt="${escAttr(place.sportKey)}" />
              </span>
            </div>`,
        className: 'sports-map-marker',
        iconSize: [44, 56],
        iconAnchor: [22, 55],
      });
    }

    // Cria markers
    const markerMap = {};
    function addPlaceMarker(place) {
      const marker = L.marker(place.coords, { icon: makePinIcon(place), riseOnHover: true }).addTo(map);
      marker.on('click', () => selectPlace(place.id));
      markerMap[place.id] = marker;
    }
    PLACES.forEach(addPlaceMarker);

    // ── Estado ─────────────────────────────────────────────────────────────────
    let activeFilter = 'all';
    let selectedId = null;

    function selectPlace(id) {
      selectedId = id;
      // Atualiza pins
      PLACES.forEach(p => {
        const el = markerMap[p.id].getElement()?.querySelector('.sports-map-pin');
        el?.classList.toggle('is-selected', p.id === id);
        markerMap[p.id].setZIndexOffset(p.id === id ? 1000 : 0);
      });
      // Atualiza cards
      document.querySelectorAll('.place-card').forEach(card => {
        card.classList.toggle('is-active', card.dataset.id === String(id));
      });
      // Scroll para o card
      const card = document.querySelector(`.place-card[data-id="${id}"]`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      // Voa para o marcador
      const place = PLACES.find(p => p.id === id);
      if (place) map.flyTo(place.coords, 15, { duration: 0.8 });
    }

    // ── Renderiza cards ────────────────────────────────────────────────────────
    function renderCards(filter) {
      const list = document.getElementById('placeList');
      const sports = FILTER_SPORTS[filter];
      const visible = sports ? PLACES.filter(p => sports.includes(p.sportKey)) : PLACES;

      document.getElementById('resultCount').textContent = visible.length;

      // Mostra/oculta markers
      PLACES.forEach(p => {
        const isVisible = !sports || sports.includes(p.sportKey);
        const el = markerMap[p.id].getElement();
        if (el) el.style.display = isVisible ? '' : 'none';
      });

      list.innerHTML = '';

      if (visible.length === 0) {
        list.innerHTML = `
            <div class="text-center py-10 text-muted">
              <p class="text-3xl mb-3">🔍</p>
              <p class="text-sm">Nenhum local encontrado para este filtro.</p>
            </div>`;
        return;
      }

      visible.forEach(place => {
        const card = document.createElement('div');
        card.className = 'place-card bg-secondary border border-white/8 rounded-xl p-3';
        card.dataset.id = String(place.id);
        card.innerHTML = `
            <div class="flex items-start gap-3">
              <div class="w-9 h-9 rounded-lg bg-zinc950 border border-white/10 flex items-center justify-center flex-shrink-0 mt-0.5">
                <img src="${escAttr(place.icon)}" alt="${escAttr(place.sportKey)}" class="w-5 h-5" style="filter:brightness(0) invert(1);opacity:0.85;" />
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-fg leading-tight truncate">${escAttr(place.title)}</p>
                <p class="text-xs text-muted mt-0.5 truncate">${escAttr(place.type)}</p>
                <p class="text-[10px] text-muted/70 mt-0.5 truncate flex items-center gap-1">
                  <svg class="w-3 h-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                  </svg>
                  ${escAttr(place.address)}
                </p>
              </div>
              <span class="flex-shrink-0 flex items-center gap-1 font-mono text-[10px] font-bold ${STATUS_COLORS[place.status]}">
                <span class="w-1.5 h-1.5 rounded-full ${STATUS_DOT[place.status]} ${place.status === 'available' ? 'live-pin' : ''}"></span>
                ${STATUS_LABELS[place.status]}
              </span>
            </div>`;
        card.addEventListener('click', () => selectPlace(place.id));
        if (isAdmin && place.persisted) {
          const editButton = document.createElement('button');
          editButton.type = 'button';
          editButton.className = 'mt-2 text-xs font-semibold text-lime hover:underline';
          editButton.textContent = 'Editar';
          editButton.addEventListener('click', event => {
            event.stopPropagation();
            openEditPlace(place);
          });
          card.appendChild(editButton);
        }
        list.appendChild(card);
      });

      // Re-seleciona o card ativo se ainda visível
      if (selectedId && visible.find(p => String(p.id) === String(selectedId))) {
        document.querySelector(`.place-card[data-id="${selectedId}"]`)?.classList.add('is-active');
      }
    }

    // ── Filtros ────────────────────────────────────────────────────────────────
    function activateFilter(filter) {
      document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.filter === filter);
      });
      activeFilter = filter;
      renderCards(activeFilter);
    }

    document.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activateFilter(chip.dataset.filter);
      });
    });

    // ── Sidebar toggle ─────────────────────────────────────────────────────────
    const sidebar = document.getElementById('sidebar');
    const openBtn = document.getElementById('openSidebar');
    const closeBtn = document.getElementById('closeSidebar');

    closeBtn.addEventListener('click', () => {
      sidebar.classList.add('sidebar-hidden');
      openBtn.classList.remove('hidden');
      openBtn.classList.add('flex');
      setTimeout(() => map.invalidateSize(), 310);
    });
    openBtn.addEventListener('click', () => {
      sidebar.classList.remove('sidebar-hidden');
      openBtn.classList.add('hidden');
      openBtn.classList.remove('flex');
      setTimeout(() => map.invalidateSize(), 310);
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    renderCards('all');
    selectPlace(1);

    const addPlaceButton = document.getElementById('addPlaceButton');
    const placeSelectionHint = document.getElementById('placeSelectionHint');
    const addPlaceModal = document.getElementById('addPlaceModal');
    const addPlaceForm = document.getElementById('addPlaceForm');
    const addPlaceError = document.getElementById('addPlaceError');
    const mapNotice = document.getElementById('mapNotice');
    const placeLatitude = document.getElementById('placeLatitude');
    const placeLongitude = document.getElementById('placeLongitude');
    const submitAddPlace = document.getElementById('submitAddPlace');
    const addPlaceTitle = document.getElementById('addPlaceTitle');
    const addPlaceDescription = document.getElementById('addPlaceDescription');
    const selectedCoordinates = document.getElementById('selectedCoordinates');
    const choosePlaceLocation = document.getElementById('choosePlaceLocation');
    let selectingPlaceLocation = false;
    let selectionMode = null;
    let editingPlace = null;

    if (isAdmin) {
      addPlaceButton.classList.remove('hidden');
    }

    function showMapNotice(message) {
      mapNotice.textContent = message;
      mapNotice.classList.remove('hidden');
    }

    function stopSelectingLocation() {
      selectingPlaceLocation = false;
      selectionMode = null;
      placeSelectionHint.classList.add('hidden');
      addPlaceButton.textContent = 'Adicionar quadra';
      map.getContainer().style.cursor = '';
    }

    function startSelectingLocation(mode) {
      selectingPlaceLocation = true;
      selectionMode = mode;
      placeSelectionHint.textContent = mode === 'edit'
        ? 'Clique no mapa para atualizar a localização. Cancelar mantém a localização atual.'
        : 'Clique no mapa para marcar a localização. Clique em “Cancelar” para sair.';
      placeSelectionHint.classList.remove('hidden');
      addPlaceButton.textContent = 'Cancelar seleção';
      map.getContainer().style.cursor = 'crosshair';
    }

    function showPlaceModal() {
      addPlaceModal.classList.remove('hidden');
      addPlaceModal.classList.add('flex');
    }

    function openNewPlace(coords) {
      editingPlace = null;
      addPlaceForm.reset();
      placeLatitude.value = coords[0];
      placeLongitude.value = coords[1];
      addPlaceTitle.textContent = 'Adicionar quadra';
      addPlaceDescription.textContent = 'A localização foi marcada no mapa. Complete os dados do local.';
      selectedCoordinates.textContent = `Localização: ${coords[0]}, ${coords[1]}`;
      choosePlaceLocation.classList.add('hidden');
      submitAddPlace.textContent = 'Salvar quadra';
      showPlaceModal();
      addPlaceForm.elements.title.focus();
    }

    function openEditPlace(place) {
      editingPlace = place;
      addPlaceForm.elements.title.value = place.title;
      addPlaceForm.elements.sport.value = place.sportKey;
      addPlaceForm.elements.type.value = place.type;
      addPlaceForm.elements.status.value = place.status;
      addPlaceForm.elements.address.value = place.address;
      placeLatitude.value = place.coords[0];
      placeLongitude.value = place.coords[1];
      addPlaceTitle.textContent = 'Editar quadra';
      addPlaceDescription.textContent = 'Altere os dados e salve para atualizar o pin no mapa.';
      selectedCoordinates.textContent = `Localização: ${place.coords[0]}, ${place.coords[1]}`;
      choosePlaceLocation.classList.remove('hidden');
      submitAddPlace.textContent = 'Salvar alterações';
      addPlaceError.classList.add('hidden');
      showPlaceModal();
      addPlaceForm.elements.title.focus();
    }

    addPlaceButton.addEventListener('click', () => {
      if (selectingPlaceLocation) {
        const mode = selectionMode;
        stopSelectingLocation();
        if (mode === 'edit') showPlaceModal();
        return;
      }
      startSelectingLocation('create');
    });

    map.on('click', event => {
      if (!selectingPlaceLocation) return;
      const mode = selectionMode;
      const coords = [event.latlng.lat.toFixed(6), event.latlng.lng.toFixed(6)];
      stopSelectingLocation();
      if (mode === 'create') {
        openNewPlace(coords);
      } else if (mode === 'edit' && editingPlace) {
        placeLatitude.value = coords[0];
        placeLongitude.value = coords[1];
        selectedCoordinates.textContent = `Localização: ${coords[0]}, ${coords[1]}`;
        showPlaceModal();
      }
    });

    function closeAddPlaceModal() {
      addPlaceModal.classList.add('hidden');
      addPlaceModal.classList.remove('flex');
      addPlaceForm.reset();
      addPlaceError.classList.add('hidden');
      editingPlace = null;
      addPlaceTitle.textContent = 'Adicionar quadra';
      addPlaceDescription.textContent = 'A localização foi marcada no mapa. Complete os dados do local.';
      choosePlaceLocation.classList.add('hidden');
      submitAddPlace.textContent = 'Salvar quadra';
    }

    document.getElementById('cancelAddPlace').addEventListener('click', closeAddPlaceModal);
    choosePlaceLocation.addEventListener('click', () => {
      addPlaceModal.classList.add('hidden');
      addPlaceModal.classList.remove('flex');
      startSelectingLocation('edit');
    });
    addPlaceModal.addEventListener('click', event => {
      if (event.target === addPlaceModal) closeAddPlaceModal();
    });

    addPlaceForm.addEventListener('submit', async event => {
      event.preventDefault();
      addPlaceError.classList.add('hidden');
      if (!addPlaceForm.reportValidity()) return;

      const formData = new FormData(addPlaceForm);
      const payload = {
        title: formData.get('title'),
        sport: formData.get('sport'),
        type: formData.get('type'),
        status: formData.get('status'),
        address: formData.get('address'),
        latitude: Number(placeLatitude.value),
        longitude: Number(placeLongitude.value),
      };
      const placeBeingEdited = editingPlace;
      const isEditing = Boolean(placeBeingEdited);
      submitAddPlace.disabled = true;

      try {
        const endpoint = isEditing
          ? `/api/quadras/${encodeURIComponent(placeBeingEdited.id)}`
          : '/api/quadras';
        const response = await window.SportsAuth.fetchWithAuth(endpoint, {
          method: isEditing ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || `Erro HTTP ${response.status}.`);

        const place = {
          ...result,
          persisted: true,
          icon: SPORT_ICONS[result.sportKey] || '../media/pins/pin-base.svg',
        };
        if (isEditing) {
          const placeIndex = PLACES.findIndex(item => String(item.id) === String(placeBeingEdited.id));
          if (placeIndex === -1) throw new Error('A quadra não está mais disponível para edição.');
          PLACES[placeIndex] = place;
          const marker = markerMap[placeBeingEdited.id];
          marker.setLatLng(place.coords);
          marker.setIcon(makePinIcon(place));
          markerMap[place.id] = marker;
          if (String(placeBeingEdited.id) !== String(place.id)) {
            delete markerMap[placeBeingEdited.id];
          }
          if (String(selectedId) === String(placeBeingEdited.id)) selectedId = place.id;
        } else {
          PLACES.push(place);
          addPlaceMarker(place);
        }
        closeAddPlaceModal();
        activateFilter('all');
        selectPlace(place.id);
        showMapNotice(isEditing ? 'Quadra atualizada.' : 'Quadra adicionada ao mapa.');
      } catch (error) {
        addPlaceError.textContent = error.message || 'Não foi possível adicionar a quadra.';
        addPlaceError.classList.remove('hidden');
      } finally {
        submitAddPlace.disabled = false;
      }
    });

    async function loadCustomPlaces() {
      try {
        const response = await fetch('/api/quadras');
        if (!response.ok) throw new Error(`Erro HTTP ${response.status}.`);
        const places = await response.json();
        if (!Array.isArray(places)) throw new Error('Resposta inválida da API de quadras.');

        places.forEach(place => {
          const normalizedPlace = {
            ...place,
            persisted: true,
            icon: SPORT_ICONS[place.sportKey] || '../media/pins/pin-base.svg',
          };
          const fallbackIndex = PLACES.findIndex(item => item.sourceKey
            && item.sourceKey === normalizedPlace.sourceKey);
          if (fallbackIndex !== -1) {
            const fallbackPlace = PLACES[fallbackIndex];
            const fallbackMarker = markerMap[fallbackPlace.id];
            if (fallbackMarker) map.removeLayer(fallbackMarker);
            delete markerMap[fallbackPlace.id];
            PLACES[fallbackIndex] = normalizedPlace;
            if (String(selectedId) === String(fallbackPlace.id)) selectedId = normalizedPlace.id;
            addPlaceMarker(normalizedPlace);
            return;
          }
          if (markerMap[normalizedPlace.id]) return;
          PLACES.push(normalizedPlace);
          addPlaceMarker(normalizedPlace);
        });
        renderCards(activeFilter);
        if (selectedId) selectPlace(selectedId);
      } catch (error) {
        console.error('Não foi possível carregar as quadras cadastradas.', error);
        showMapNotice('Não foi possível carregar as quadras cadastradas. Os locais existentes continuam visíveis.');
      }
    }

    loadCustomPlaces();
  </script>
</body>

</html>
